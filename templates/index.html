<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lung & Colon Cancer Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .radio-option {
            flex: 1;
            position: relative;
        }

        .radio-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .radio-option label {
            display: block;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            margin: 0;
        }

        .radio-option input[type="radio"]:checked + label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .radio-option label:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .upload-area {
            border: 3px dashed #d0d0d0;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: #e8edff;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
            color: #667eea;
        }

        .upload-text {
            color: #666;
            margin-bottom: 10px;
        }

        .file-name {
            margin-top: 15px;
            padding: 10px;
            background: #e8edff;
            border-radius: 8px;
            color: #667eea;
            font-weight: 600;
            display: none;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            margin-top: 30px;
            display: none;
        }

        .result-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 15px;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .result-title {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .result-label {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result-score {
            font-size: 32px;
            font-weight: 700;
        }

        .all-results {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 15px;
        }

        .all-results h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: white;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-item-label {
            color: #333;
            font-weight: 600;
        }

        .result-item-score {
            color: #667eea;
            font-weight: 700;
            font-size: 18px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ff4757;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 Cancer Detection System</h1>
        <p class="subtitle">AI-Powered Lung & Colon Cancer Analysis</p>

        <form id="predictionForm">
            <div class="section">
                <label>Select Cancer Type:</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="lung" name="cancer_type" value="lung">
                        <label for="lung">🫁 Lung Cancer</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="colon" name="cancer_type" value="colon">
                        <label for="colon">🔬 Colon Cancer</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="both" name="cancer_type" value="both" checked>
                        <label for="both">📊 Both</label>
                    </div>
                </div>
            </div>

            <div class="section">
                <label>Upload CT Scan Image:</label>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📤</div>
                    <div class="upload-text">
                        <strong>Click to upload</strong> or drag and drop
                    </div>
                    <div class="upload-text" style="font-size: 12px; color: #999;">
                        PNG, JPG, JPEG, BMP, TIFF (Max 16MB)
                    </div>
                    <input type="file" id="fileInput" name="file" accept=".png,.jpg,.jpeg,.bmp,.tiff">
                    <div class="file-name" id="fileName"></div>
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn" disabled>
                Analyze Image
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing image...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <div class="result-card">
                <div class="result-title">Top Prediction</div>
                <div class="result-label" id="topLabel"></div>
                <div class="result-score" id="topScore"></div>
            </div>

            <div class="all-results">
                <h3>All Predictions</h3>
                <div id="allResults"></div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('predictionForm');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // File selection
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileName.textContent = `📄 ${e.target.files[0].name}`;
                fileName.style.display = 'block';
                submitBtn.disabled = false;
            }
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                fileName.textContent = `📄 ${files[0].name}`;
                fileName.style.display = 'block';
                submitBtn.disabled = false;
            }
        });

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('cancer_type', document.querySelector('input[name="cancer_type"]:checked').value);

            // Show loading
            loading.style.display = 'block';
            results.style.display = 'none';
            error.style.display = 'none';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    // Display results
                    document.getElementById('topLabel').textContent = data.top_prediction.label;
                    document.getElementById('topScore').textContent = `${data.top_prediction.score}%`;

                    const allResultsDiv = document.getElementById('allResults');
                    allResultsDiv.innerHTML = '';
                    
                    data.results.forEach(result => {
                        const item = document.createElement('div');
                        item.className = 'result-item';
                        item.innerHTML = `
                            <span class="result-item-label">${result.label}</span>
                            <span class="result-item-score">${result.score}%</span>
                        `;
                        allResultsDiv.appendChild(item);
                    });

                    results.style.display = 'block';
                } else {
                    throw new Error(data.error || 'Prediction failed');
                }
            } catch (err) {
                error.textContent = `Error: ${err.message}`;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
