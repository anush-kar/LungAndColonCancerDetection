<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lung Cancer Detection</title>
    <script src="cities.js"></script>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <div class="container">
        <h1>🔬 Cancer Detection System</h1>
        <p class="subtitle">AI-Powered Lung Cancer Analysis</p>

        <form id="predictionForm">
            <div class="section">
                <label>Select Cancer Type:</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="lung" name="cancer_type" value="lung">
                        <label for="lung">🫁 Lung Cancer</label>
                    </div>
                </div>
            </div>

            <div class="section">
                <label>Upload CT Scan Image:</label>
                
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📤</div>
                    <div class="upload-text">
                        <strong>Click to upload</strong> or drag and drop
                    </div>
                    <div class="upload-text" style="font-size: 12px; color: #999;">
                        PNG, JPG, JPEG, BMP, TIFF (Max 16MB)
                    </div>
                    <input type="file" id="fileInput" name="file" accept=".png,.jpg,.jpeg,.bmp,.tiff" onchange="loadFile(event)">
                    <div class="file-name" id="fileName"></div>
                </div>
                <div id="imagePreview" style="display: flex; justify-content: center; margin-top: 15px;">
                    <img id="output" alt="Uploaded Image Preview">
                </div>

                <script>
                    // JavaScript function to handle the file selection and display the image
                    var loadFile = function(event) {
                        // Get the image element where the preview will be displayed
                        var image = document.getElementById('output');
                        
                        // Set the source of the image element to a URL created from the selected file
                        image.src = URL.createObjectURL(event.target.files[0]);
                        
                        // Make the image visible
                        image.style.display = 'block'; 
                        
                        // Optional: revoke the object URL when the image has loaded to free up memory
                        image.onload = function() {
                            URL.revokeObjectURL(image.src); 
                        }
                    };
                </script>

            </div>

            <button type="submit" class="btn" id="submitBtn" disabled>
                Analyze Image
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing image...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <div class="result-card">
                <div class="result-title">Top Prediction</div>
                <div class="result-label" id="topLabel"></div>
                <div class="result-score" id="topScore"></div>
            </div>

            <div class="all-results">
                <h3>All Predictions</h3>
                <div id="allResults"></div>
            </div>
        </div>
        <div class="section" style="margin-top: 20px;">
            <label>Select your Location</label>
            <div id="city_dropdowns">
                <select onchange="print_city('state', this.selectedIndex);" id="sts" name ="stt" class="form-control" required></select>
                <select id ="state" class="form-control" required></select>
                <script language="javascript">print_state("sts");</script>
            </div>
        </div>

        <div class="aqi-container">
            <div class="aqi-title">🌫️ Air Quality by Locality (WAQI)</div>
            <button type="button" class="btn" id="fetchAqiBtn" style="margin-top:0;">Fetch Air Quality</button>
            <div class="loading" id="aqiLoading" style="display:none; padding:12px 0 0 0;">
                <p>Fetching air quality data...</p>
            </div>
            <div class="error" id="aqiError" style="display:none;"></div>
            <div id="aqiResults" style="display:none; margin-top:14px;">
                <div class="aqi-meta" id="aqiMeta"></div>
                <div class="aqi-grid" id="aqiGrid"></div>
                <pre class="aqi-json" id="aqiJson"></pre>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('predictionForm');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');
        const fetchAqiBtn = document.getElementById('fetchAqiBtn');
        const aqiLoading = document.getElementById('aqiLoading');
        const aqiError = document.getElementById('aqiError');
        const aqiResults = document.getElementById('aqiResults');
        const aqiMeta = document.getElementById('aqiMeta');
        const aqiGrid = document.getElementById('aqiGrid');
        const aqiJson = document.getElementById('aqiJson');

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // File selection
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileName.textContent = `📄 ${e.target.files[0].name}`;
                fileName.style.display = 'block';
                submitBtn.disabled = false;
            }
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                fileName.textContent = `📄 ${files[0].name}`;
                fileName.style.display = 'block';
                submitBtn.disabled = false;
            }
        });

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('cancer_type', document.querySelector('input[name="cancer_type"]:checked').value);

            // Show loading
            loading.style.display = 'block';
            results.style.display = 'none';
            error.style.display = 'none';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    // Display results
                    document.getElementById('topLabel').textContent = data.top_prediction.label;
                    document.getElementById('topScore').textContent = `${data.top_prediction.score}%`;

                    const allResultsDiv = document.getElementById('allResults');
                    allResultsDiv.innerHTML = '';
                    
                    data.results.forEach(result => {
                        const item = document.createElement('div');
                        item.className = 'result-item';
                        item.innerHTML = `
                            <span class="result-item-label">${result.label}</span>
                            <span class="result-item-score">${result.score}%</span>
                        `;
                        allResultsDiv.appendChild(item);
                    });

                    results.style.display = 'block';
                } else {
                    throw new Error(data.error || 'Prediction failed');
                }
            } catch (err) {
                error.textContent = `Error: ${err.message}`;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        function addAqiItem(label, value) {
            const item = document.createElement('div');
            item.className = 'aqi-chip';
            item.innerHTML = `
                <div class="aqi-chip-label">${label}</div>
                <div class="aqi-chip-value">${value ?? 'N/A'}</div>
            `;
            aqiGrid.appendChild(item);
        }

        fetchAqiBtn.addEventListener('click', async () => {
            const stateSelect = document.getElementById('sts');
            const citySelect = document.getElementById('state');
            const selectedCity = citySelect.value ? citySelect.value.trim() : '';
            const selectedState = stateSelect.value ? stateSelect.value.trim() : '';

            aqiError.style.display = 'none';
            aqiResults.style.display = 'none';
            aqiGrid.innerHTML = '';

            if (!selectedCity) {
                aqiError.textContent = 'Please select a city/locality first.';
                aqiError.style.display = 'block';
                return;
            }

            aqiLoading.style.display = 'block';
            fetchAqiBtn.disabled = true;

            try {
                const response = await fetch(`/api/air-quality?city=${encodeURIComponent(selectedCity)}`);
                const payload = await response.json();

                if (!response.ok || !payload.success) {
                    throw new Error(payload.error || 'Unable to fetch air quality data.');
                }

                const data = payload.data || {};
                const iaqi = data.iaqi || {};

                aqiMeta.innerHTML = `
                    <strong>Location:</strong> ${data.city?.name || selectedCity}, ${selectedState || 'N/A'}<br>
                    <strong>Updated:</strong> ${data.time?.s || 'N/A'}<br>
                    <strong>Primary Pollutant:</strong> ${data.dominentpol || 'N/A'}
                `;

                addAqiItem('AQI', data.aqi);
                addAqiItem('PM2.5', iaqi.pm25?.v);
                addAqiItem('PM10', iaqi.pm10?.v);
                addAqiItem('O3', iaqi.o3?.v);
                addAqiItem('NO2', iaqi.no2?.v);
                addAqiItem('SO2', iaqi.so2?.v);
                addAqiItem('CO', iaqi.co?.v);
                addAqiItem('Temperature', iaqi.t?.v);
                addAqiItem('Humidity', iaqi.h?.v);
                addAqiItem('Pressure', iaqi.p?.v);
                addAqiItem('Wind', iaqi.w?.v);

                aqiJson.textContent = JSON.stringify(data, null, 2);
                aqiResults.style.display = 'block';
            } catch (err) {
                aqiError.textContent = `Error: ${err.message}`;
                aqiError.style.display = 'block';
            } finally {
                aqiLoading.style.display = 'none';
                fetchAqiBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
